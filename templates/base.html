<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Flask Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<nav>
    <div>
        Flask Login
    </div>
    <div>
        {% if session.usuario %}
        Bienvenido {{ session.usuario.nombre }}
        |
        <a href="{{ url_for('logout') }}">
            Cerrar sesión
        </a>
        {% endif %}
    </div>
</nav>

<div style="padding:20px;">
    {% block content %}
    {% endblock %}
</div>
</body>

</html>
